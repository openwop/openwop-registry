name: Vendored spec sync

# Finding-1 drift guard: schemas/ (v1 at the root, v2 under schemas/v2/) and
# spec/v2/*.json here are vendored copies of normative artifacts whose source of
# truth is the openwop/openwop spec corpus AT THE TAG IN ./CORPUS_TAG (RFC 0176
# §E.1, RFC 0177 §C.6). This fails if a copy drifts. Runs weekly (catches a tag
# bump that was not re-vendored) and on PRs that touch the vendored paths or the
# pin. Re-vendor with `node scripts/check-vendored-sync.mjs --write`.

on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'schemas/**'
      - 'spec/v2/**'
      - 'api/**'
      - 'CORPUS_TAG'
      - 'scripts/check-vendored-sync.mjs'

jobs:
  vendored-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/check-vendored-sync.mjs
